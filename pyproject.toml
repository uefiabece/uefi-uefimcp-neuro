[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uefi-uefimcp-neuro"
version = "0.1.0"
description = "Servidor MCP para Bacharelado em Neurociência da UFABC"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
# Enable for subjects requiring symbolic math (e.g. calculus, algebra)
math = [
    "sympy>=1.12",
    "numpy>=1.26",
]
# Enable for subjects requiring image understanding/editing
vision = [
    "pillow>=10.0",
]

pdf = ["pypdf>=4.0"]

[project.scripts]
uefi-mcp-neuro = "src.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "config"
"prompts" = "prompts"
"content" = "content"
